<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CULOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f9;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    /* Contenedor de Autenticación */
    .auth-container {
      max-width: 400px;
      margin: 30px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .auth-container h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .auth-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-login {
      background-color: #007bff;
      color: white;
    }

    .btn-login:hover {
      background-color: #0056b3;
    }

    .btn-register {
      background-color: #28a745;
      color: white;
    }

    .btn-register:hover {
      background-color: #1e7e34;
    }

    .btn-logout {
      background-color: #dc3545;
      color: white;
      margin-left: 10px;
    }

    #error-message {
      color: #d9534f;
      margin-top: 15px;
      font-size: 0.9rem;
      word-break: break-word;
    }

    /* Panel de usuario y galería */
    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item img, .gallery-item video {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-item img:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    .hidden {
      display: none !important;
    }

    /* Modal / Zoom de Imágenes */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      object-fit: contain;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <!-- Firebase SDKs (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Cloudinary Widget -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

  <h1>CULOS</h1>

  <!-- Formulario de Autenticación -->
  <div id="auth-box" class="auth-container">
    <h2>Acceso a la Galería</h2>
    <input type="email" id="email" placeholder="Correo electrónico" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <div class="btn-group">
      <button class="btn-login" onclick="login()">Iniciar Sesión</button>
      <button class="btn-register" onclick="register()">Registrarse</button>
    </div>
    <div id="error-message"></div>
  </div>

  <!-- Panel de la Galería Privada -->
  <div id="gallery-box" class="hidden">
    <div class="user-header">
      <div>
        <span>Conectado como: <strong id="user-email"></strong></span>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
      </div>
      <button class="btn-login" id="upload-btn">Subir Imagen/Video</button>
    </div>

    <div class="gallery-grid" id="gallery-grid">
      <!-- Fotos fijas locales de tu carpeta -->
      <div class="gallery-item"><img src="imagenes/28838659.jpg" alt="Foto" onclick="openZoom(this.src)"></div>
      <div class="gallery-item"><img src="imagenes/images (1).jpg" alt="Foto" onclick="openZoom(this.src)"></div>
      <div class="gallery-item"><img src="imagenes/images (2).jpg" alt="Foto" onclick="openZoom(this.src)"></div>
      <div class="gallery-item"><img src="imagenes/images (3).jpg" alt="Foto" onclick="openZoom(this.src)"></div>
      <div class="gallery-item"><img src="imagenes/images (4).jpg" alt="Foto" onclick="openZoom(this.src)"></div>
      <div class="gallery-item"><img src="imagenes/images.jpg" alt="Foto" onclick="openZoom(this.src)"></div>
      <div class="gallery-item"><img src="imagenes/Priscilla Lopez 2.jpeg" alt="Foto" onclick="openZoom(this.src)"></div>
      <div class="gallery-item"><img src="imagenes/priscilla-lopez_01.jpg" alt="Foto" onclick="openZoom(this.src)"></div>
      <div class="gallery-item"><img src="imagenes/Priscillalopezm.jpg" alt="Foto" onclick="openZoom(this.src)"></div>
    </div>
  </div>

  <!-- Modal para Zoom de fotos -->
