<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Privada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f9;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    /* Contenedor de Autenticación */
    .auth-container {
      max-width: 400px;
      margin: 30px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .auth-container h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .auth-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-login {
      background-color: #007bff;
      color: white;
    }

    .btn-login:hover {
      background-color: #0056b3;
    }

    .btn-register {
      background-color: #28a745;
      color: white;
    }

    .btn-register:hover {
      background-color: #1e7e34;
    }

    .btn-logout {
      background-color: #dc3545;
      color: white;
      margin-left: 10px;
    }

    #error-message {
      color: #d9534f;
      margin-top: 15px;
      font-size: 0.9rem;
      word-break: break-word;
    }

    /* Panel de usuario y galería */
    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item img, .gallery-item video {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .hidden {
      display: none !important;
    }
  </style>

  <!-- Firebase Compat SDK v10.12.0 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Cloudinary Widget -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

  <h1>CULOS</h1>

  <!-- Formulario de Autenticación -->
  <div id="auth-box" class="auth-container">
    <h2>Acceso a la Galería</h2>
    <input type="email" id="email" placeholder="Correo electrónico" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <div class="btn-group">
      <button class="btn-login" onclick="login()">Iniciar Sesión</button>
      <button class="btn-register" onclick="register()">Registrarse</button>
    </div>
    <div id="error-message"></div>
  </div>

  <!-- Panel de la Galería Privada -->
  <div id="gallery-box" class="hidden">
    <div class="user-header">
      <div>
        <span>Conectado como: <strong id="user-email"></strong></span>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
      </div>
      <button class="btn-login" id="upload-btn">Subir Imagen/Video</button>
    </div>

    <div class="gallery-grid" id="gallery-grid">
      <!-- Los archivos subidos aparecerán aquí -->
    </div>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBnq4z7akcZA2o6FGCiSNIdtFB5eybZBAQ",
      authDomain: "galeria-amigos123.firebaseapp.com",
      projectId: "galeria-amigos123",
      storageBucket: "galeria-amigos123.appspot.com",
      messagingSenderId: "1083437158932",
      appId: "1:1083437158932:web:1a2b3c4d5e6f"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const authBox = document.getElementById('auth-box');
    const galleryBox = document.getElementById('gallery-box');
    const userEmailSpan = document.getElementById('user-email');
    const errorMessage = document.getElementById('error-message');

    // Registrar usuario
    function register() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      errorMessage.innerText = "";

      auth.createUserWithEmailAndPassword(email, password)
        .catch(error => {
          errorMessage.innerText = "Firebase: " + error.message;
        });
    }

    // Iniciar Sesión
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      errorMessage.innerText = "";

      auth.signInWithEmailAndPassword(email, password)
        .catch(error => {
          errorMessage.innerText = "Firebase: " + error.message;
        });
    }

    // Cerrar Sesión
    function logout() {
      auth.signOut();
    }

    // Escuchar cambios de sesión
    auth.onAuthStateChanged(user => {
      if (user) {
        authBox.classList.add('hidden');
        galleryBox.classList.remove('hidden');
        userEmailSpan.innerText = user.email;
      } else {
        authBox.classList.remove('hidden');
        galleryBox.classList.add('hidden');
        userEmailSpan.innerText = "";
      }
    });

    // Widget de Cloudinary
    const myWidget = cloudinary.createUploadWidget({
      cloudName: 'ox4v1r1w', 
      uploadPreset: 'ml_default'
    }, (error, result) => { 
      if (!error && result && result.event === "success") { 
        const mediaUrl = result.info.secure_url;
        const grid = document.getElementById('gallery-grid');
        const item = document.createElement('div');
        item.className = 'gallery-item';

        if (result.info.resource_type === 'video') {
          item.innerHTML = `<video src="${mediaUrl}" controls></video>`;
        } else {
          item.innerHTML = `<img src="${mediaUrl}" alt="Media">`;
        }
        grid.prepend(item);
      }
    });

    document.getElementById("upload-btn").addEventListener("click", function(){
      myWidget.open();
    }, false);
  </script>
</body>
</html>
