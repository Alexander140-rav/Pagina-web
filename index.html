<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C U L O S</title>
  
  <!-- Firebase SDKs (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: #f8fafc;
      padding: 15px;
      width: 100%;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #ffffff;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: #333;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-size: 0.85rem;
      font-weight: bold;
      pointer-events: auto;
      animation: slideIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-success { background: #28a745; }
    .toast-error { background: #dc3545; }
    .toast-info { background: #007bff; }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast.fade-out {
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s, transform 0.3s;
    }

    /* Tarjeta Auth */
    .auth-container {
      max-width: 420px;
      width: 100%;
      margin: 10px auto;
      background: rgba(255, 255, 255, 0.08) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .auth-container h2 {
      margin-bottom: 20px;
      font-size: 1.4rem;
      color: #ffffff;
    }

    .auth-container input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-size: 0.9rem;
      color: #ffffff;
      outline: none;
    }

    .auth-container input::placeholder {
      color: #94a3b8;
    }

    /* Campo de contraseña con Ojito */
    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .password-wrapper input {
      padding-right: 45px;
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 38%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      user-select: none;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    button {
      padding: 10px 16px;
      font-size: 0.9rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      flex: 1;
    }

    .btn-login {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }

    .btn-register {
      background-color: #10b981;
      color: white;
    }

    .btn-logout {
      background-color: #dc3545;
      color: white;
      padding: 6px 12px;
      font-size: 0.78rem;
      border-radius: 15px;
    }

    .btn-edit-name {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    #error-message {
      color: #f87171;
      margin-top: 12px;
      font-size: 0.85rem;
      word-break: break-word;
    }

    /* Panel Galería */
    #gallery-box {
      width: 100%;
      max-width: 1200px;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin: 0 auto 15px auto;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-wrap: wrap;
      gap: 12px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007bff, #6610f2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .profile-email {
      font-weight: bold;
      font-size: 0.9rem;
      color: #ffffff;
    }

    .profile-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .media-stats {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: bold;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .media-stats strong {
      color: #38bdf8;
    }

    .toolbar {
      width: 100%;
      margin: 0 auto 15px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #3b82f6;
      color: white;
    }

    .sort-btn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Grilla Ajustada */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
      }
    }

    .gallery-card {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .gallery-card img, .gallery-card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .card-footer {
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.78rem;
    }

    .author-tag {
      font-weight: 600;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 3px;
      color: #cbd5e1;
      padding: 2px 4px;
    }

    .btn-icon.liked {
      color: #e63946;
    }

    .btn-delete-card {
      color: #f87171;
    }

    .hidden {
      display: none !important;
    }

    /* Modal / Zoom */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: pan-y;
    }

    .modal-main {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-media-container {
      max-width: 90%;
      max-height: 80%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      z-index: 1005;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 1.4rem;
      padding: 6px 12px;
      border-radius: 50%;
      z-index: 1002;
    }

    .prev-btn { left: 10px; }
    .next-btn { right: 10px; }

    .zoom-controls {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 6px;
      z-index: 1002;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 10px;
    }

    .zoom-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 16px;
    }

    /* Comentarios y Respuestas */
    .comments-drawer {
      position: absolute;
      right: 0;
      top: 0;
      width: 100%;
      max-width: 340px;
      height: 100%;
      background: #1e293b;
      color: white;
      z-index: 1004;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .comments-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-drawer {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      color: #94a3b8;
    }

    .comments-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .comment-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reply-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0;
      font-weight: bold;
    }

    .delete-comment-btn {
      background: transparent;
      border: none;
      color: #f87171;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0 2px;
    }

    .comment-text {
      color: #e2e8f0;
      word-break: break-word;
    }

    .drawer-footer {
      padding: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 6px;
    }

    .drawer-footer input {
      flex: 1;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: white;
      font-size: 0.85rem;
    }

    @media (max-width: 500px) {
      .user-header {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-tabs {
        width: 100%;
        justify-content: space-between;
      }
      .filter-btn {
        flex: 1;
        text-align: center;
        padding: 6px 4px;
        font-size: 0.72rem;
      }
      .sort-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <h1>C U L O S</h1>

  <!-- Autenticación -->
  <div id="auth-box" class="auth-container">
    <h2>Inicio de sesión</h2>
    <input type="text" id="display-name" placeholder="👤 Nombre o Apodo (solo registro)">
    <input type="email" id="email" placeholder="✉️ Correo electrónico" required>
    
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="🔒 Contraseña" required>
      <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar contraseña">👁️</button>
    </div>

    <div class="btn-group">
      <button class="btn-login" onclick="login()">Iniciar Sesión</button>
      <button class="btn-register" onclick="register()">Registrarse</button>
    </div>

    <div id="error-message"></div>
  </div>

  <!-- Galería -->
  <div id="gallery-box" class="hidden">
    <div class="user-header">
      <div class="profile-card">
        <div class="profile-avatar" id="user-avatar">U</div>
        <div class="profile-info">
          <span class="profile-email" id="user-email"></span>
          <div class="profile-actions">
            <button class="btn-edit-name" onclick="editDisplayName()">✏️ Cambiar nombre</button>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
          </div>
        </div>
      </div>

      <div class="media-stats">
        <span>📸 <strong id="photo-count">0</strong> Fotos</span>
        <span>•</span>
        <span>🎥 <strong id="video-count">0</strong> Videos</span>
      </div>

      <input type="file" id="catbox-file-input" accept="image/*,video/*" style="display: none;">
      <button class="btn-login" id="upload-btn" style="flex: initial; width: 100%;">Subir Imagen/Video</button>
    </div>

    <div class="toolbar">
      <div class="filter-tabs">
        <button class="filter-btn active" onclick="setFilter('all', this)">Todas</button>
        <button class="filter-btn" onclick="setFilter('photo', this)">📸 Fotos</button>
        <button class="filter-btn" onclick="setFilter('video', this)">🎥 Videos</button>
        <button class="filter-btn" onclick="setFilter('mine', this)">👤 Mías</button>
      </div>

      <button class="sort-btn" id="sort-btn" onclick="toggleSort()">⏱️ Más recientes</button>
    </div>

    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <!-- Modal Zoom -->
  <div id="image-modal" class="modal">
    <span class="close-modal" onclick="closeZoom()">&times;</span>
    
    <div class="modal-main">
      <button class="nav-btn prev-btn" onclick="prevImage(event)">❮</button>
      
      <div class="modal-media-container" id="modal-media-container">
        <img class="modal-content" id="modal-img">
      </div>

      <button class="nav-btn next-btn" onclick="nextImage(event)">❯</button>

      <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn(event)">🔍 + Zoom</button>
        <button class="zoom-btn" onclick="zoomOut(event)">🔍 - Reducir</button>
        <button class="zoom-btn" onclick="resetZoom(event)">🔄 Reset</button>
        <button class="zoom-btn" id="modal-like-btn" onclick="toggleModalLike()">❤️ Me gusta</button>
        <button class="zoom-btn" id="modal-comments-btn" onclick="toggleCommentsDrawer()">💬 Comentarios (0)</button>
      </div>
    </div>

    <div class="comments-drawer" id="comments-drawer">
      <div class="drawer-header">
        <h3>💬 Comentarios</h3>
        <button class="close-drawer" onclick="toggleCommentsDrawer()">&times;</button>
      </div>
      <div class="comments-body" id="comments-list"></div>
      <div class="drawer-footer">
        <input type="text" id="comment-input" placeholder="Comentario...">
        <button class="btn-login" onclick="submitComment()" style="flex: initial;">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBnq4z7akcZA2o6FGCiSNIdtFB5eybZBAQ",
      authDomain: "galeria-amigos123.firebaseapp.com",
      projectId: "galeria-amigos123",
      storageBucket: "galeria-amigos123.appspot.com",
      messagingSenderId: "1083437158932",
      appId: "1:1083437158932:web:1a2b3c4d5e6f"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const authBox = document.getElementById('auth-box');
    const galleryBox = document.getElementById('gallery-box');
    const userEmailSpan = document.getElementById('user-email');
    const userAvatarDiv = document.getElementById('user-avatar');
    const errorMessage = document.getElementById('error-message');
    const grid = document.getElementById('gallery-grid');

    let currentUser = null;
    let unsubscribeMedia = null;
    let unsubscribeComments = null;

    let allMediaItems = [];
    let activeFilter = 'all';
    let activeSort = 'newest';

    const staticLocalFiles = [];

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password-btn');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleBtn.innerText = '🙈';
      } else {
        passInput.type = 'password';
        toggleBtn.innerText = '👁️';
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerText = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function register() {
      const name = document.getElementById('display-name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      errorMessage.innerText = "";

      if (!name) {
        errorMessage.innerText = "Escribe tu nombre o apodo antes de registrarte.";
        return;
      }

      auth.createUserWithEmailAndPassword(email, password)
        .then(userCredential => {
          return userCredential.user.updateProfile({ displayName: name });
        })
        .then(() => {
          updateUserProfileUI(auth.currentUser);
          showToast("¡Cuenta creada con éxito!", "success");
        })
        .catch(error => { errorMessage.innerText = "Firebase: " + error.message; });
    }

    function editDisplayName() {
      if (!currentUser) return;
      const newName = prompt("Ingresa tu Nombre o Apodo:", currentUser.displayName || "");
      if (newName && newName.trim() !== "") {
        currentUser.updateProfile({ displayName: newName.trim() }).then(() => {
          updateUserProfileUI(currentUser);
          showToast("Nombre actualizado a " + newName.trim(), "success");
        }).catch(err => showToast("Error al actualizar: " + err.message, "error"));
      }
    }

    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      errorMessage.innerText = "";

      auth.signInWithEmailAndPassword(email, password)
        .then(() => showToast("Sesión iniciada correctamente", "success"))
        .catch(error => { errorMessage.innerText = "Firebase: " + error.message; });
    }

    function logout() {
      auth.signOut().then(() => showToast("Sesión cerrada", "info"));
    }

    function updateUserProfileUI(user) {
      const nameToShow = (user.displayName && user.displayName.trim() !== "") ? user.displayName : user.email;
      userEmailSpan.innerText = nameToShow;
      userAvatarDiv.innerText = nameToShow.charAt(0).toUpperCase();
    }

    function loadSavedMedia() {
      if (unsubscribeMedia) unsubscribeMedia();

      unsubscribeMedia = db.collection('media')
        .onSnapshot(snapshot => {
          const dynamicItems = [];
          snapshot.forEach(doc => {
            dynamicItems.push({ id: doc.id, ...doc.data() });
          });

          const staticItemsFormatted = staticLocalFiles.map((url, idx) => ({
            id: 'static_' + idx,
            url: url,
            type: 'image',
            uploadedBy: 'Sistema',
            userId: 'system',
            createdAt: new Date(2026, 0, 1),
            likes: [],
            isStatic: true
          }));

          allMediaItems = [...dynamicItems, ...staticItemsFormatted];
          renderGallery();
        }, error => console.error("Error en Firestore:", error));
    }

    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGallery();
    }

    function toggleSort() {
      activeSort = activeSort === 'newest' ? 'oldest' : 'newest';
      document.getElementById('sort-btn').innerText = activeSort === 'newest' ? '⏱️ Más recientes' : '⏱️ Más antiguas';
      renderGallery();
    }

    function renderGallery() {
      grid.innerHTML = '';

      let filtered = allMediaItems.filter(item => {
        if (activeFilter === 'photo') return item.type !== 'video';
        if (activeFilter === 'video') return item.type === 'video';
        if (activeFilter === 'mine') return currentUser && item.userId === currentUser.uid;
        return true;
      });

      filtered.sort((a, b) => {
        const timeA = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate().getTime() : new Date(a.createdAt).getTime()) : 0;
        const timeB = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate().getTime() : new Date(b.createdAt).getTime()) : 0;
        return activeSort === 'newest' ? timeB - timeA : timeA - timeB;
      });

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'gallery-card';

        const likes = item.likes || [];
        const isLiked = currentUser && likes.includes(currentUser.uid);
        const canDelete = currentUser && (item.userId === currentUser.uid);

        let mediaElement = '';
        if (item.type === 'video') {
          mediaElement = `<video src="${item.url}" controls playsinline preload="metadata" style="width:100%; height:200px; object-fit:cover; background:#000;"></video>`;
        } else {
          mediaElement = `<img src="${item.url}" alt="Media" onclick="openZoom('${item.id}')">`;
        }

        const deleteButtonHtml = canDelete ? 
          `<button class="btn-icon btn-delete-card" onclick="deleteMedia('${item.id}', event)" title="Eliminar">🗑️</button>` : '';

        card.innerHTML = `
          ${mediaElement}
          <div class="card-footer">
            <span class="author-tag">👤 ${escapeHtml(item.uploadedBy || 'Anónimo')}</span>
            <div class="card-actions">
              <button class="btn-icon ${isLiked ? 'liked' : ''}" onclick="toggleLike('${item.id}', event)">
                ${isLiked ? '❤️' : '🤍'} <span>${likes.length}</span>
              </button>
              ${deleteButtonHtml}
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      const totalPhotos = allMediaItems.filter(i => i.type !== 'video').length;
      const totalVideos = allMediaItems.filter(i => i.type === 'video').length;
      document.getElementById('photo-count').innerText = totalPhotos;
      document.getElementById('video-count').innerText = totalVideos;
    }

    function toggleLike(id, e) {
      if (e) e.stopPropagation();
      if (!currentUser) return;

      const item = allMediaItems.find(i => i.id === id);
      if (!item || item.isStatic) {
        showToast("Elemento base no modificable", "info");
        return;
      }

      const mediaRef = db.collection('media').doc(id);
      const likes = item.likes || [];
      const hasLiked = likes.includes(currentUser.uid);

      if (hasLiked) {
        mediaRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
        showToast("Le quitaste Me gusta", "info");
      } else {
        mediaRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
        showToast("¡Te gusta esta publicación! ❤️", "success");
      }
    }

    function deleteMedia(id, e) {
      if (e) e.stopPropagation();
      if (!currentUser) return;

      if (confirm("¿Eliminar publicación?")) {
        db.collection('media').doc(id).delete().then(() => {
          showToast("Eliminado correctamente 🗑️", "success");
          if (modal.style.display === "flex") closeZoom();
        }).catch(err => showToast("Error al eliminar: " + err.message, "error"));
      }
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        authBox.classList.add('hidden');
        galleryBox.classList.remove('hidden');
        updateUserProfileUI(user);
        loadSavedMedia();
      } else {
        currentUser = null;
        if (unsubscribeMedia) unsubscribeMedia();
        authBox.classList.remove('hidden');
        galleryBox.classList.add('hidden');
        userEmailSpan.innerText = "";
        userAvatarDiv.innerText = "";
        grid.innerHTML = "";
      }
    });

    let currentScale = 1;
    let translateX = 0, translateY = 0;

    let currentModalMediaId = null;
    let currentImageIndex = 0;

    const modal = document.getElementById('image-modal');
    const commentsDrawer = document.getElementById('comments-drawer');

    function openZoom(id) {
      const item = allMediaItems.find(i => i.id === id);
      if (!item) return;

      currentModalMediaId = id;
      currentImageIndex = allMediaItems.findIndex(i => i.id === id);

      modal.style.display = "flex";
      
      const container = document.getElementById('modal-media-container');
      container.innerHTML = '';

      if (item.type === 'video') {
        const video = document.createElement('video');
        video.src = item.url;
        video.controls = true;
        video.playsInline = true;
        video.id = 'modal-media';
        video.className = 'modal-content';
        container.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = item.url;
        img.id = 'modal-media';
        img.className = 'modal-content';
        container.appendChild(img);
      }

      updateModalLikeBtn();
      resetZoomState();
      loadComments(id);
    }

    function closeZoom() {
      modal.style.display = "none";
      commentsDrawer.classList.remove('open');
      if (unsubscribeComments) unsubscribeComments();
      resetZoomState();
    }

    function prevImage(e) {
      if (e) e.stopPropagation();
      if (allMediaItems.length <= 1) return;
      currentImageIndex = (currentImageIndex - 1 + allMediaItems.length) % allMediaItems.length;
      openZoom(allMediaItems[currentImageIndex].id);
    }

    function nextImage(e) {
      if (e) e.stopPropagation();
      if (allMediaItems.length <= 1) return;
      currentImageIndex = (currentImageIndex + 1) % allMediaItems.length;
      openZoom(allMediaItems[currentImageIndex].id);
    }

    function updateModalLikeBtn() {
      const item = allMediaItems.find(i => i.id === currentModalMediaId);
      const btn = document.getElementById('modal-like-btn');
      if (!item) return;

      const likes = item.likes || [];
      const isLiked = currentUser && likes.includes(currentUser.uid);
      btn.innerText = `${isLiked ? '❤️' : '🤍'} Me gusta (${likes.length})`;
    }

    function toggleModalLike() {
      if (currentModalMediaId) {
        toggleLike(currentModalMediaId);
        setTimeout(updateModalLikeBtn, 300);
      }
    }

    function toggleCommentsDrawer() {
      commentsDrawer.classList.toggle('open');
    }

    function prepareReply(userName) {
      const input = document.getElementById('comment-input');
      input.value = `@${userName} `;
      input.focus();
    }

    function deleteComment(commentId) {
      if (!currentModalMediaId || !currentUser) return;
      if (confirm("¿Borrar este comentario?")) {
        db.collection('media').doc(currentModalMediaId).collection('comments').doc(commentId).delete()
          .then(() => showToast("Comentario borrado 🗑️", "info"))
          .catch(err => showToast("Error al borrar: " + err.message, "error"));
      }
    }

    function loadComments(mediaId) {
      const list = document.getElementById('comments-list');
      const btn = document.getElementById('modal-comments-btn');
      list.innerHTML = '<p style="color:#888;">Cargando...</p>';

      if (unsubscribeComments) unsubscribeComments();

      if (mediaId.startsWith('static_')) {
        list.innerHTML = '<p style="color:#888;">No disponible en archivos locales.</p>';
        btn.innerText = `💬 Comentarios (0)`;
        return;
      }

      const currentMediaItem = allMediaItems.find(i => i.id === mediaId);

      unsubscribeComments = db.collection('media').doc(mediaId).collection('comments')
        .orderBy('createdAt', 'asc')
        .onSnapshot(snapshot => {
          list.innerHTML = '';
          const count = snapshot.size;
          btn.innerText = `💬 Comentarios (${count})`;

          if (snapshot.empty) {
            list.innerHTML = '<p style="color:#888;">Sin comentarios.</p>';
            return;
          }

          snapshot.forEach(doc => {
            const c = doc.data();
            const commentId = doc.id;
            
            // Permite borrar si eres autor del comentario, o si tu nombre/email coincide con el autor o el dueño de la imagen
            const isCommentAuthor = currentUser && (c.userId === currentUser.uid || c.userName === (currentUser.displayName || currentUser.email));
            const isMediaOwner = currentUser && currentMediaItem && (currentMediaItem.userId === currentUser.uid);
            const canDeleteComment = isCommentAuthor || isMediaOwner;

            const div = document.createElement('div');
            div.className = 'comment-item';
            const timeStr = c.createdAt ? new Date(c.createdAt.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
            
            const deleteBtnHtml = canDeleteComment ? 
              `<button class="delete-comment-btn" onclick="deleteComment('${commentId}')" title="Borrar comentario">🗑️</button>` : '';

            div.innerHTML = `
              <div class="comment-header">
                <strong>${escapeHtml(c.userName)}</strong>
                <div class="comment-actions">
                  <small style="color:#888;">${timeStr}</small>
                  <button class="reply-btn" onclick="prepareReply('${escapeHtml(c.userName)}')">↩️ Responder</button>
                  ${deleteBtnHtml}
                </div>
              </div>
              <div class="comment-text">${escapeHtml(c.text)}</div>
            `;
            list.appendChild(div);
          });
          list.scrollTop = list.scrollHeight;
        });
    }

    function submitComment() {
      const input = document.getElementById('comment-input');
      const text = input.value.trim();
      if (!text || !currentModalMediaId || currentModalMediaId.startsWith('static_')) return;

      const name = currentUser.displayName || currentUser.email;

      db.collection('media').doc(currentModalMediaId).collection('comments').add({
        userId: currentUser.uid,
        userName: name,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        input.value = '';
        showToast("Comentario enviado 💬", "success");
      }).catch(err => showToast("Error al comentar: " + err.message, "error"));
    }

    function resetZoomState() {
      currentScale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function updateTransform() {
      const el = document.getElementById('modal-media');
      if (el) {
        el.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
      }
    }

    function zoomIn(e) {
      if (e) e.stopPropagation();
      currentScale = Math.min(currentScale + 0.5, 5);
      updateTransform();
    }

    function zoomOut(e) {
      if (e) e.stopPropagation();
      currentScale = Math.max(currentScale - 0.5, 1);
      if (currentScale === 1) { translateX = 0; translateY = 0; }
      updateTransform();
    }

    function resetZoom(e) {
      if (e) e.stopPropagation();
      resetZoomState();
    }

    let touchStartX = 0;
    let touchEndX = 0;

    modal.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    modal.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      if (currentScale > 1) return;

      const swipeDistance = touchEndX - touchStartX;
      const minSwipeDistance = 50;

      if (swipeDistance > minSwipeDistance) {
        prevImage();
      } else if (swipeDistance < -minSwipeDistance) {
        nextImage();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (modal.style.display === "flex") {
        if (e.key === "ArrowLeft") prevImage();
        if (e.key === "ArrowRight") nextImage();
        if (e.key === "Escape") closeZoom();
      }
    });

    modal.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) currentScale = Math.min(currentScale + 0.2, 5);
      else {
        currentScale = Math.max(currentScale - 0.2, 1);
        if (currentScale === 1) { translateX = 0; translateY = 0; }
      }
      updateTransform();
    }, { passive: false });

    const fileInput = document.getElementById("catbox-file-input");
    const uploadBtn = document.getElementById("upload-btn");

    function isVideoFile(file) {
      if (file.type && file.type.startsWith('video/')) return true;
      return /\.(mp4|mov|avi|webm|mkv|3gp|m4v)$/i.test(file.name);
    }

    async function uploadVideoToExternalServer(file) {
      try {
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', file);
        const res = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: formData });
        if (res.ok) {
          const text = (await res.text()).trim();
          if (text.startsWith('http')) return text;
        }
      } catch (e) { console.warn("Catbox error", e); }

      try {
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('time', '72h');
        formData.append('fileToUpload', file);
        const res = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', { method: 'POST', body: formData });
        if (res.ok) {
          const text = (await res.text()).trim();
          if (text.startsWith('http')) return text;
        }
      } catch (e) { console.warn("Litterbox error", e); }

      try {
        const formData = new FormData();
        formData.append('file', file);
        const res = await fetch('https://tmpfiles.org/api/v1/upload', { method: 'POST', body: formData });
        if (res.ok) {
          const json = await res.json();
          if (json && json.data && json.data.url) {
            return json.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
          }
        }
      } catch (e) { console.warn("Tmpfiles error", e); }

      throw new Error("No se pudo conectar con el servidor de videos.");
    }

    function compressImageToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1200;
            const MAX_HEIGHT = 1200;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);
            resolve(compressedBase64);
          };
          img.onerror = () => reject(new Error("No se pudo procesar la imagen."));
        };
        reader.onerror = () => reject(new Error("Error al leer el archivo."));
      });
    }

    if (uploadBtn && fileInput) {
      uploadBtn.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;

        showToast("Procesando y subiendo archivo... ⏳", "info");

        try {
          let mediaUrl = "";
          const isVideo = isVideoFile(file);

          if (isVideo) {
            mediaUrl = await uploadVideoToExternalServer(file);
          } else {
            mediaUrl = await compressImageToBase64(file);
          }

          if (mediaUrl.length > 950000) {
            throw new Error("El archivo excede el tamaño máximo permitido.");
          }

          const resourceType = isVideo ? 'video' : 'image';

          await db.collection('media').add({
            url: mediaUrl,
            type: resourceType,
            uploadedBy: currentUser.displayName || currentUser.email,
            userId: currentUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            likes: []
          });

          showToast("¡Subido exitosamente! 🎉", "success");
          fileInput.value = "";
        } catch (err) {
          console.error("Error al subir:", err);
          showToast("Error al subir: " + err.message, "error");
        }
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
